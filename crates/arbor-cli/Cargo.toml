[package]
name = "arbor-graph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Command-line interface for Arbor"

[[bin]]
name = "arbor"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true

arbor-core = { path = "../arbor-core", version = "3.0.0" }
arbor-graph = { path = "../arbor-graph", version = "3.0.0" }
arbor-scip = { path = "../arbor-scip", version = "3.0.0" }
arbor-watcher = { path = "../arbor-watcher", version = "3.0.0" }
arbor-server = { path = "../arbor-server", version = "3.0.0" }
arbor-mcp = { path = "../arbor-mcp", version = "3.0.0" }

clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
indicatif = "0.17"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
strsim = "0.11"
petgraph = "0.6"
anyhow = "1.0"
bincode = "1.3"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
# Used to synthesise a real SCIP index for the `arbor scip` integration test,
# so the test exercises protobuf decoding rather than a hand-mocked struct.
scip = "0.10"
protobuf = "=3.7.2"
